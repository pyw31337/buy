<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>렛츠바이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="top">
  <div class="brand"><span class="logo">L</span><b>렛츠바이</b></div>
  <nav id="tabs"><button data-tab="home" class="on">추천</button><button data-tab="items">품목</button></nav>
  <div class="mode" id="mode"></div>
</header>
<main>
  <section id="home" class="tab on">
    <div id="start" class="start">
      <h1>메일 속 구매내역,<br>클릭 한 번에</h1>
      <a class="cta" href="letsbuy-extension.zip" download>확장 받기</a>
      <ol class="icons">
        <li><span class="ic" data-i="download"></span><b>받고 압축 풀기</b></li>
        <li><span class="ic" data-i="puzzle"></span><b>확장 관리 화면에 끌어놓기</b></li>
        <li><span class="ic" data-i="mail"></span><b>메일에서 <span class="logo sm">L</span> 클릭</b></li>
      </ol>
      <button class="link" id="demo">데모 보기</button>
    </div>
    <div id="results">
      <div class="hero"><div><p class="eyebrow" id="today"></p><h1 id="headline"></h1></div><div class="stats" id="stats"></div></div>
      <div class="cards" id="due"></div>
      <h2 class="sec" id="seasonH">시즌</h2><div class="cards" id="season"></div>
    </div>
  </section>
  <section id="items" class="tab">
    <div class="toolbar"><input id="q" placeholder="검색"><div class="seg" id="filter"><button data-f="all" class="on">전체</button><button data-f="주기">주기</button><button data-f="시즌">시즌</button><button data-f="기타">비정기</button></div></div>
    <div class="list" id="list"></div>
  </section>
  <details class="adv"><summary>고급</summary>
    <div class="advgrid">
      <div><b>메일 붙여넣기</b><input id="pSubject" placeholder="제목"><input id="pDate" type="date"><textarea id="pBody" rows="4" placeholder="본문"></textarea><button id="addPaste" class="btn sm">추가</button><p id="pasteMsg" class="hint"></p></div>
      <div><b>파일</b><input type="file" id="file" accept=".json"><div class="row"><button id="export" class="btn sm ghost">백업</button><button id="reset" class="btn sm ghost danger">초기화</button></div></div>
      <div><b>로컬 AI (Ollama)</b><input id="aiModel" placeholder="qwen2.5:3b"><div class="row"><button class="btn sm" id="aiRun">정리</button><button class="btn sm ghost" id="aiReset">되돌리기</button></div><p id="aiMsg" class="hint"></p></div>
      <div><b>상태</b><p id="extState" class="hint">확장 확인 중</p><div class="row"><button id="pullExt" class="btn sm ghost">다시 불러오기</button><button class="btn sm ghost" id="diagWeb">진단 파일</button></div></div>
    </div>
  </details>
</main>
<div id="toast" class="toast"></div>
<div id="sheet" class="sheet"><div class="sheet-body" id="sheetBody"></div></div>
<script src="core.js"></script><script src="sample.js"></script><script src="app.js"></script>
</body></html>
